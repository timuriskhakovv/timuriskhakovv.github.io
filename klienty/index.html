<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0B0D">
<title>Клиенты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Onest:wght@400;600;800&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Тёмная тема всегда. Цвета стикеров — как на сайте poryadok */
:root{
  --bg:#0A0B0D; --card:#121418; --tile:#181B20; --line:#262A31; --ink:#F4F4F1; --muted:#8E9196;
  --yellow:#FFE27A; --green:#BFE3A6; --pink:#F9B9C9; --blue:#AFCDF5; --orange:#FFC99A; --st-ink:#141517;
  --display:'Oswald',sans-serif; --body:'Onest',sans-serif; --hand:'Caveat',cursive; --mono:'JetBrains Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.03em;text-transform:uppercase}
.sub{color:var(--muted);font:500 12px var(--mono);margin-top:2px}

/* вход */
#vhod{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:340px;margin:0 auto}
#vhod input{font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
#vhod input:focus{border-color:var(--yellow)}
#vhod button{font:600 16px var(--body);padding:14px;border:0;border-radius:12px;background:var(--yellow);color:var(--st-ink);cursor:pointer;transition:transform .12s}
#vhod button:active{transform:scale(.97)}
#oshibka{color:var(--pink);font-size:14px;min-height:20px}

/* карточка */
.klient{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.shapka{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.klient h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.pill{flex:none;padding:4px 10px;border-radius:999px;background:var(--yellow);color:var(--st-ink);font-size:12px;font-weight:600;white-space:nowrap}

/* полоска этапов: кружки на линии */
.put{position:relative;display:flex;justify-content:space-between;margin:20px 2px 6px}
.put::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:2px;background:var(--line)}
.put .zapolneno{position:absolute;left:14px;top:13px;height:2px;background:var(--green)}
.tochka{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--mono);background:var(--tile);border:2px solid var(--line);color:var(--muted);cursor:pointer;transition:transform .15s}
.tochka:active{transform:scale(.9)}
.tochka.done{background:var(--green);border-color:var(--green);color:var(--st-ink)}
.tochka.now{background:var(--yellow);border-color:var(--yellow);color:var(--st-ink);box-shadow:0 0 0 4px rgba(255,226,122,.18)}
.put-podpis{text-align:center;font-size:13px;color:var(--ink);margin-bottom:14px}
.put-podpis b{color:var(--yellow);font-weight:600}
.put-podpis span{color:var(--muted)}

/* плитки */
.plitki{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plitka{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .2s}
.plitka:active{transform:scale(.97)}
.plitka:hover{border-color:#3a3f48}
.plitka .ярлык{display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.plitka .chislo{display:block;font-family:var(--display);font-size:22px;font-weight:600;margin-top:4px;line-height:1.1}
.plitka .pod{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.plitka.sled{border-left:3px solid var(--blue)}
.plitka.otkr .chislo{color:var(--orange)}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--green)}

/* раскрывашки */
.razdely{margin-top:14px}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 2px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .znak{width:8px;height:8px;border-radius:2px;flex:none}
summary .schet{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .2s;margin-left:6px}
details[open]>summary::after{transform:rotate(90deg)}
.vnutri{padding:0 2px 14px}
ul.spisok{list-style:none;display:grid;gap:6px}
ul.spisok li{padding-left:18px;position:relative}
ul.spisok li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;border-radius:2px;background:var(--muted)}
.slova{font-family:var(--hand);font-size:22px;line-height:1.2;display:grid;gap:6px;color:var(--yellow)}
.etap{display:flex;gap:10px;padding:8px;border-radius:10px}
.etap.now{background:rgba(255,226,122,.08)}
.etap .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);border:1.5px solid var(--line);color:var(--muted)}
.etap.done .n{background:var(--green);border-color:var(--green);color:var(--st-ink)}
.etap.now .n{background:var(--yellow);border-color:var(--yellow);color:var(--st-ink)}
.etap small{display:block;color:var(--muted);font-size:13px}
.etap em{font-style:normal;color:var(--muted);font:500 11px var(--mono);margin-left:4px}
.vstrecha{background:var(--tile);border-radius:12px;padding:12px;margin-top:8px}
.vstrecha .zag{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.vstrecha .zag span{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.vstrecha p{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <form id="vhod" autocomplete="off">
    <h1>Клиенты</h1>
    <p class="sub">Закрытая страница. Введи пароль.</p>
    <input id="parol" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
    <button type="submit">Открыть</button>
    <div id="oshibka"></div>
  </form>
  <main id="ekran" hidden></main>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function rasshifrovat(parol){
  const p = JSON.parse(atob(SHIFR));
  const kluch0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(parol), "PBKDF2", false, ["deriveKey"]);
  const kluch = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"},
    kluch0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const otkr = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, kluch, b64(p.data));
  return JSON.parse(new TextDecoder().decode(otkr));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const spisok = arr => `<ul class="spisok">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
const tys = n => (n/1000).toLocaleString("ru-RU") + " тыс";
const klass = (n, etap) => n < etap ? "done" : n === etap ? "now" : "";

function razdel(id, nazvanie, cvet, schet, html, otkryt){
  return `<details id="${id}"${otkryt?" open":""}>
    <summary><i class="znak" style="background:${cvet}"></i>${esc(nazvanie)}<span class="schet">${schet}</span></summary>
    <div class="vnutri">${html}</div></details>`;
}

function kartochka(k, etapy){
  const id = k.id;
  const tek = etapy.find(e => e.n === k.etap) || etapy[0];
  const shir = Math.max(0, (k.etap - 1) / (etapy.length - 1) * 100);
  const tochki = etapy.map(e => `<button class="tochka ${klass(e.n,k.etap)}" data-k="${id}" data-etap="${e.n}" title="${esc(e.nazvanie)}">${e.n < k.etap ? "✓" : e.n}</button>`).join("");
  const oplacheno = k.oplata.platezhi.reduce((s,p)=>s+p.summa,0);
  const proc = Math.round(oplacheno / k.oplata.vsego * 100);
  const proshlo = k.istoriya.filter(v => v.vstrecha).length;

  const etapyHtml = etapy.map(e => `
    <div class="etap ${klass(e.n,k.etap)}" id="${id}-etap-${e.n}">
      <div class="n">${e.n < k.etap ? "✓" : e.n}</div>
      <div><b>${esc(e.nazvanie)}</b><em>${esc(e.vremya)}</em><small>${esc(e.opisanie)}</small></div>
    </div>`).join("");

  const istoriyaHtml = [...k.istoriya].reverse().map(v => `
    <div class="vstrecha">
      <div class="zag">${esc(v.nazvanie)}<span>${esc(v.data)}</span></div>
      ${v.itogi.length ? `<p>Итоги</p>${spisok(v.itogi)}` : ""}
      ${v.zadaniya.length ? `<p>Задания</p>${spisok(v.zadaniya)}` : ""}
      ${v.dogovorennosti.length ? `<p>Договорённости</p>${spisok(v.dogovorennosti)}` : ""}
    </div>`).join("");

  return `
  <section class="klient">
    <div class="shapka">
      <div><h2>${esc(k.imya)}</h2><div class="meta">${esc(k.odnoy_strokoy || k.kratko)}</div></div>
      <span class="pill">${esc(k.status)}</span>
    </div>

    <div class="put"><i class="zapolneno" style="width:calc((100% - 28px) * ${shir/100})"></i>${tochki}</div>
    <div class="put-podpis"><b>Этап ${k.etap} · ${esc(tek.nazvanie)}</b> <span>из ${etapy.length}</span></div>

    <div class="plitki">
      <button class="plitka sled" data-otkryt="${id}-podg">
        <span class="ярлык">Следующая</span>
        <span class="chislo">${esc(k.sleduyushchaya.korotko || k.sleduyushchaya.kogda)}</span>
        <span class="pod">${esc(k.sleduyushchaya.nazvanie)}</span>
      </button>
      <button class="plitka otkr" data-otkryt="${id}-otkr">
        <span class="ярлык">Открыто</span>
        <span class="chislo">${k.otkryto.length}</span>
        <span class="pod">вопроса ждут ответа</span>
      </button>
      <button class="plitka" data-otkryt="${id}-ist">
        <span class="ярлык">Встреч</span>
        <span class="chislo">${proshlo} / ${etapy.length}</span>
        <span class="pod">${esc(k.vremya_vstrech_korotko || k.vremya_vstrech.join(" · "))}</span>
      </button>
      <button class="plitka" data-otkryt="${id}-opl">
        <span class="ярлык">Оплата</span>
        <span class="chislo">${(oplacheno/1000).toLocaleString("ru-RU")} / ${tys(k.oplata.vsego)}</span>
        <div class="mini"><i style="width:${proc}%"></i></div>
      </button>
    </div>

    <div class="razdely">
      ${razdel(id+"-podg","Подготовка к встрече","var(--blue)",k.sleduyushchaya.podgotovka.length,
        `<p class="meta" style="margin:0 0 8px">${esc(k.sleduyushchaya.kogda)}</p>${spisok(k.sleduyushchaya.podgotovka)}`, false)}
      ${razdel(id+"-otkr","Открыто","var(--orange)",k.otkryto.length, spisok(k.otkryto))}
      ${razdel(id+"-slova","Его слова","var(--yellow)",k.ego_slova.length, `<div class="slova">${k.ego_slova.map(s=>`<div>${esc(s)}</div>`).join("")}</div>`)}
      ${razdel(id+"-bol","Что болит","var(--pink)",k.bol.length, spisok(k.bol))}
      ${razdel(id+"-put","Путь ведения","var(--green)",`${k.etap} / ${etapy.length}`, etapyHtml)}
      ${razdel(id+"-ist","История","var(--muted)",k.istoriya.length, istoriyaHtml)}
      ${razdel(id+"-opl","Оплата","var(--green)",`${proc}%`,
        spisok(k.oplata.platezhi.map(p=>`${p.data} — ${p.summa.toLocaleString("ru-RU")} ₽${p.chek?", чек выписан":""}`).concat([`Дальше: ${k.oplata.sleduyushiy}`])))}
    </div>
  </section>`;
}

function otkrytRazdel(id, yakor){
  const d = document.getElementById(id);
  if (!d) return;
  d.open = true;
  (yakor ? document.getElementById(yakor) : d).scrollIntoView({behavior:"smooth", block:"center"});
}

function pokazat(d){
  document.getElementById("vhod").hidden = true;
  const ekran = document.getElementById("ekran");
  ekran.innerHTML = `<h1>Клиенты</h1><p class="sub">Обновлено ${esc(d.obnovleno)} · в работе ${d.klienty.length}</p>`
    + d.klienty.map(k => kartochka(k, d.etapy)).join("");
  ekran.hidden = false;
  ekran.addEventListener("click", e => {
    const p = e.target.closest("[data-otkryt]");
    if (p) return otkrytRazdel(p.dataset.otkryt);
    const t = e.target.closest(".tochka");
    if (t) otkrytRazdel(`${t.dataset.k}-put`, `${t.dataset.k}-etap-${t.dataset.etap}`);
  });
}

document.getElementById("vhod").addEventListener("submit", async e => {
  e.preventDefault();
  const parol = document.getElementById("parol").value;
  const osh = document.getElementById("oshibka");
  osh.textContent = "Открываю…";
  try {
    const d = await rasshifrovat(parol);
    try { sessionStorage.setItem("klienty-p", parol); } catch(_) {}
    pokazat(d);
  } catch(_) {
    osh.textContent = "Пароль не подошёл — данные не расшифровались.";
  }
});

// пароль помнится до закрытия вкладки
(async () => {
  let p = null;
  try { p = sessionStorage.getItem("klienty-p"); } catch(_) {}
  if (p) { try { pokazat(await rasshifrovat(p)); } catch(_) {} }
})();
</script>
